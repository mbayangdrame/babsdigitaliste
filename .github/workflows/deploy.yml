name: Build and Deploy

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Supprimer node_modules et package-lock.json
        run: |
          rm -rf node_modules
          rm -f package-lock.json

      - name: Installer les dépendances
        run: |
          npm install

      - name: Build project
        run: npm run build

      - name: 📂 Déployer le frontend via FTP
        uses: SamKirkland/FTP-Deploy-Action@4.3.0
        with:
          server: ftp.babsdigitaliste.com
          username: babsd2524861
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./dist/
          server-dir: /  # Remplace par le dossier racine de ton site sur LWS
